name: Build and Deploy

on:
  push:
    branches:
      - master
      - staging

jobs:
  # Production (master) still builds and serves the Vue 2 app until cutover.
  # Staging builds the new app in v2/ (since 2026-11-21) so it can be tested
  # against the staging backend. At cutover, point master at the v2 job too.
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Vue build
        run: |
          if [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            npm run build:staging
          fi
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            npm run build:prod
          fi

      # Guards against the built bundle pointing at the wrong environment. The
      # Cognito pool and API URL come from committed .env files, and .env.production
      # on the staging branch held the STAGING pool for years - a merge to master
      # would have shipped a prod build that authenticated against the staging user
      # pool, locking every real user out of sign-in. Values are checked against
      # literals here rather than against the .env files, so a wrong .env is caught
      # instead of validating itself. These are public client identifiers.
      - name: Verify the build targets the right environment
        run: |
          set -euo pipefail
          PROD_POOL=us-east-1_yRxMUcgpm
          STAGING_POOL=us-east-1_5Ivj5CJ6z

          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            WANT_POOL=$PROD_POOL; WRONG_POOL=$STAGING_POOL
            WANT_API=https://api.haohaotiantian.com/
            WRONG_API=https://api.staging.haohaotiantian.com/
          else
            WANT_POOL=$STAGING_POOL; WRONG_POOL=$PROD_POOL
            WANT_API=https://api.staging.haohaotiantian.com/
            WRONG_API=https://api.haohaotiantian.com/
          fi

          # --include='*.js' restricts this to executable bundles. Source maps embed
          # pre-build sources and legitimately mention both environments, so scanning
          # them produces false positives.
          scan() { grep -rqF --include='*.js' "$1" dist/js/; }

          if ! scan "$WANT_POOL"; then
            echo "::error::bundle is missing the expected Cognito pool $WANT_POOL"
            exit 1
          fi
          if scan "$WRONG_POOL"; then
            echo "::error::bundle contains the WRONG Cognito pool $WRONG_POOL"
            exit 1
          fi
          if ! scan "$WANT_API"; then
            echo "::error::bundle is missing the expected API URL $WANT_API"
            exit 1
          fi
          if scan "$WRONG_API"; then
            echo "::error::bundle contains the WRONG API URL $WRONG_API"
            exit 1
          fi
          echo "bundle verified: pool $WANT_POOL, api $WANT_API"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Copy files to S3 (prod)
        if: github.ref == 'refs/heads/master'
        run: |
          aws s3 cp dist s3://haohaotiantian.com --grant read=uri=http://acs.amazonaws.com/groups/global/AllUsers --recursive
          aws cloudfront create-invalidation --distribution-id EZXGJW5MPGC3K --paths /index.html /app.js

      - name: Copy files to S3 (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          aws s3 cp dist s3://staging.haohaotiantian.com --grant read=uri=http://acs.amazonaws.com/groups/global/AllUsers --recursive
          aws cloudfront create-invalidation --distribution-id E14R2YU4CYXBZG --paths /index.html /app.js

  build-v2:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The full font build needs Google Fonts and the upstream font repos,
      # which GitHub can reach. It rebuilds every subset so all characters used
      # in copy (and cjk-tiers.json) are covered. Output is used for this build
      # only, not committed.
      - name: Set up Python for the font build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build fonts
        run: |
          pip install "fonttools[woff]" brotli
          node scripts/build-fonts.mjs

      - name: Build
        run: npx vite build --mode staging

      # Same guard as the Vue 2 job: the bundle must point at the staging
      # Cognito pool and API, never production's.
      - name: Verify the build targets staging
        run: |
          set -euo pipefail
          scan() { grep -rqF --include='*.js' "$1" dist/assets/; }
          scan us-east-1_5Ivj5CJ6z || { echo "::error::bundle is missing the staging Cognito pool"; exit 1; }
          ! scan us-east-1_yRxMUcgpm || { echo "::error::bundle contains the PRODUCTION Cognito pool"; exit 1; }
          scan https://api.staging.haohaotiantian.com || { echo "::error::bundle is missing the staging API URL"; exit 1; }
          ! scan https://api.haohaotiantian.com || { echo "::error::bundle contains the PRODUCTION API URL"; exit 1; }
          echo "bundle verified: staging pool and API"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Copies only; nothing in the bucket is deleted (old Vue 2 files stay,
      # unused). Hashed files cache for a year. The files that name the current
      # version (index.html, the service worker, its registration and the
      # manifest) are never cached, so browsers pick up each deploy.
      - name: Copy files to S3 (staging)
        run: |
          set -euo pipefail
          BUCKET=s3://staging.haohaotiantian.com
          GRANT="read=uri=http://acs.amazonaws.com/groups/global/AllUsers"
          aws s3 cp dist "$BUCKET" --recursive --grants "$GRANT" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude index.html --exclude sw.js --exclude registerSW.js --exclude manifest.webmanifest --exclude "workbox-*.js"
          for f in index.html sw.js registerSW.js manifest.webmanifest; do
            aws s3 cp "dist/$f" "$BUCKET/$f" --grants "$GRANT" --cache-control "no-cache"
          done
          for f in dist/workbox-*.js; do
            aws s3 cp "$f" "$BUCKET/$(basename "$f")" --grants "$GRANT" --cache-control "no-cache"
          done
          aws cloudfront create-invalidation --distribution-id E14R2YU4CYXBZG --paths "/*"
